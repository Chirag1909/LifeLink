# ==============================================================
# LifeLink: Spring Boot & JDBC Configuration
# ==============================================================
server.port=5000

# Application Name
spring.application.name=lifelink-backend

# --------------------------------------------------------------
# 1. JDBC DATABASE CONFIGURATION
# Default: H2 Embedded File-Based Persistent Database
# Stores data in ./data/lifelink_db.mv.db (persists between restarts)
# --------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/lifelink_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Interactive Web Console (accessible at http://localhost:5000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --------------------------------------------------------------
# Alternative: MySQL Database Configuration
# (Uncomment below and comment H2 lines above to connect to MySQL)
# --------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/lifelink_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --------------------------------------------------------------
# JWT & Security Settings
# --------------------------------------------------------------
lifelink.jwt.secret=lifelink_super_secure_jwt_secret_key_2025_college_project_spring_boot_32_bytes_long!
lifelink.jwt.expiration=604800000

# Client URL for CORS
lifelink.client.url=http://localhost:5173
